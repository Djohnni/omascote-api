name: Radar foundation CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/radar-amistosos-api-foundation-20260824
      - codex/radar-amistosos-api-identity-20260824
      - codex/radar-amistosos-api-instagram-verification-20260824

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omascote_test
          POSTGRES_USER: omascote_test
          POSTGRES_PASSWORD: omascote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omascote_test -d omascote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://omascote_test:omascote_test@127.0.0.1:5432/omascote_test
      RADAR_AMISTOSOS_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate migrations and idempotency
        run: |
          npm run db:migrate
          npm run db:migrate
      - run: npm test
